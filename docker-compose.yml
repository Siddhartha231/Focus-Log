# Local copy of the production setup: the API plus Postgres.
#   docker compose up --build
#   focuslog register --server http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: focuslog
      POSTGRES_PASSWORD: focuslog
      POSTGRES_DB: focuslog
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focuslog"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://focuslog:focuslog@db:5432/focuslog
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
