name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=xml --cov-report=term
      # Codecov is free with the GitHub Student Developer Pack.
      # Add the repo at codecov.io and save its token as the CODECOV_TOKEN secret.
      - uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  # The same server and sync tests again, this time on real Postgres,
  # because that's what the deployed server runs on.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: focuslog
          POSTGRES_PASSWORD: focuslog
          POSTGRES_DB: focuslog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U focuslog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FOCUSLOG_TEST_DATABASE_URL: postgresql://focuslog:focuslog@localhost:5432/focuslog_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_server.py tests/test_sync.py
