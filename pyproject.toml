[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focuslog"
version = "0.2.0"
description = "Offline-first Pomodoro study tracker: CLI, terminal UI and a sync server"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Siddhartha Ramineni" }]
# The core CLI only needs the standard library.
dependencies = []

[project.optional-dependencies]
tui = ["textual>=1.0"]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "sentry-sdk>=2.0",
]
dev = [
    "focuslog[tui,server]",
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
focuslog = "focuslog.cli:main"
focuslog-server = "focuslog.server.app:run"

[project.urls]
Repository = "https://github.com/Siddhartha231/Focus-Log"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["focuslog"]
branch = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# I use % formatting on purpose, it reads fine for short strings
ignore = ["UP031"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Query()/Header() go in argument defaults by design
"src/focuslog/server/app.py" = ["B008"]
# the PowerShell script in there has long lines that can't be wrapped
"src/focuslog/notify.py" = ["E501"]
